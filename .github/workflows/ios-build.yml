
name: Build Ciel Music IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Find Xcode project
        run: |
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)

      - name: Build unsigned IPA
        run: |
          PROJECT=$(find . -maxdepth 4 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Không tìm thấy Xcode project."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | sed -n '/Schemes:/,$p' | grep -v 'Schemes:' | head -1 | xargs)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Không tìm thấy scheme."
            exit 1
          fi

          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Không tìm thấy ứng dụng .app"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Ciel-Music-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ciel-Music-unsigned-IPA
          path: Ciel-Music-unsigned.ipa
          if-no-files-found: error
