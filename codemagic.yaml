
workflows:
  ciel-music-ios:
    name: Ciel Music iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract source
        script: |
          ZIP=$(find "$CM_BUILD_DIR" -maxdepth 3 -name "CielMusic_Project.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/project"
          unzip -q "$ZIP" -d "$CM_BUILD_DIR/project"

      - name: Locate Xcode project
        script: |
          PROJECT=$(find "$CM_BUILD_DIR/project" -name "CielMusic.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            find "$CM_BUILD_DIR/project" -maxdepth 5 -type f
            exit 1
          fi

          echo "Found project: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Build iOS app
        script: |
          PROJECT=$(find "$CM_BUILD_DIR/project" -name "CielMusic.xcodeproj" -print -quit)

          xcodebuild \
            -project "$PROJECT" \
            -scheme CielMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package and verify IPA
        script: |
          APP=$(find "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos" \
            -type d -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: App bundle not found"
            exit 1
          fi

          echo "App found: $APP"
          du -sh "$APP"
          ls -lah "$APP"

          if [ ! -s "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")

          if [ ! -s "$APP/$EXECUTABLE" ]; then
            echo "ERROR: App executable missing"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"
          rm -f Ciel-Music-unsigned.ipa
          zip -qry Ciel-Music-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh Ciel-Music-unsigned.ipa
          unzip -l Ciel-Music-unsigned.ipa

          if [ ! -s Ciel-Music-unsigned.ipa ]; then
            echo "ERROR: IPA is empty"
            exit 1
          fi

    artifacts:
      - Ciel-Music-unsigned.ipa
